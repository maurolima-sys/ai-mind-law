name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript type check
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun run test

      - name: Run lint on application integration files
        run: >-
          bunx eslint
          vitest.config.ts
          src/components/pocketmind/DocumentQaPanel.tsx
          src/components/pocketmind/EvidenceComparisonPanel.tsx
          src/components/pocketmind/GuidedTour.tsx
          src/components/pocketmind/LocalWorkspaceLibrary.tsx
          src/components/pocketmind/PocketMindApp.tsx
          src/components/pocketmind/SourceDocumentViewer.tsx
          src/lib/i18n/en.ts
          src/lib/i18n/es.ts
          src/lib/i18n/index.tsx
          src/lib/i18n/pt.ts
          src/lib/services/documentProcessing.ts
          src/lib/services/documentQa.ts
          src/lib/services/evidence.ts
          src/lib/services/evidenceComparison.ts
          src/lib/services/evidenceComparisonSchema.ts
          src/lib/services/firebaseAi.ts
          src/lib/services/localWorkspace.ts
          src/lib/services/tenderAnalysis.ts
          src/lib/services/tenderAnalysisSchema.ts
          src/lib/services/discoverDocuments.functions.ts
          src/lib/types.ts
          src/components/pocketmind/SmartDiscoveryPanel.tsx
          src/test/document-processing.test.ts
          src/test/document-qa-panel.test.tsx
          src/test/document-qa.test.ts
          src/test/model-fallback.test.ts
          src/test/csv.test.ts
          src/test/tender-analysis.test.ts

      - name: Build application
        run: bun run build
